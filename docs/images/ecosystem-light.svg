      <text x="94" y="249" fill="#64748b" font-size="12" font-weight="800" letter-spacing="1.8">IDENTITY JOURNEYS</text>
      <g>
        <rect x="90" y="266" width="248" height="82" rx="16" fill="#edf2f8" stroke="#d8e0ea"/>
