        <rect x="432" y="454" width="5" height="82" rx="2.5" fill="url(#accent)"/>
        <text x="452" y="483" fill="#8b5cf6" font-size="13" font-weight="800" letter-spacing="1.2">OUTBOX</text>
        <text x="452" y="508" fill="#111827" font-size="16" font-weight="650">Transactional and fenced</text>
      </g>
    </g><g filter="url(#shadow)">
