        <rect x="90" y="454" width="5" height="82" rx="2.5" fill="url(#accent)"/>
        <text x="110" y="483" fill="#8b5cf6" font-size="13" font-weight="800" letter-spacing="1.2">EN · AR</text>
        <text x="110" y="508" fill="#111827" font-size="16" font-weight="650">Accessible LTR and RTL theme</text>
      </g>
    </g><g filter="url(#shadow)">
