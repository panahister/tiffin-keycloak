      <text x="850" y="249" fill="#64748b" font-size="12" font-weight="800" letter-spacing="1.8">BUSINESS CONTEXT</text>
      <g>
        <rect x="846" y="266" width="320" height="82" rx="16" fill="#edf2f8" stroke="#d8e0ea"/>
        <rect x="846" y="266" width="5" height="82" rx="2.5" fill="url(#accent)"/>
        <text x="866" y="295" fill="#8b5cf6" font-size="13" font-weight="800" letter-spacing="1.2">KAFKA</text>
        <text x="866" y="320" fill="#111827" font-size="16" font-weight="650">Versioned lifecycle events</text>
      </g><g>
