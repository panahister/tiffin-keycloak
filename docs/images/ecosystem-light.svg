        <text x="110" y="295" fill="#8b5cf6" font-size="13" font-weight="800" letter-spacing="1.2">SIGN UP</text>
        <text x="110" y="320" fill="#111827" font-size="16" font-weight="650">Registration and PKCE</text>
      </g><g>
        <rect x="90" y="360" width="248" height="82" rx="16" fill="#edf2f8" stroke="#d8e0ea"/>
