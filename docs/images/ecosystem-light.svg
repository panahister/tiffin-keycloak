<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
  <title id="title">Tiffin Identity ecosystem</title>
  <desc id="desc">Keycloak authority with durable business identity propagation. Three connected groups show identity journeys, keycloak authority, business context.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22c3ee"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity=".18"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d8e0ea" stroke-opacity=".26"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8ca0b3" flood-opacity=".20"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#22c3ee"/></marker>
  </defs>
  <rect width="1280" height="640" fill="#f7f9fc"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1030" cy="70" r="270" fill="url(#glow)"/>
  <g transform="translate(72 54)">
    <rect width="62" height="62" rx="18" fill="url(#accent)"/>
    <text x="31" y="40" text-anchor="middle" fill="#091018" font-size="23" font-weight="900">ID</text>
    <text x="84" y="27" fill="#111827" font-size="30" font-weight="850">Tiffin Identity</text>
    <text x="84" y="54" fill="#64748b" font-size="16" font-weight="520">Keycloak authority with durable business identity propagation</text>
  </g>
  <g transform="translate(72 143)">
    <text fill="#111827" font-size="23" font-weight="760">One identity authority. Durable propagation. Clear ownership.</text>
    <rect x="0" y="25" width="1088" height="2" rx="1" fill="url(#accent)" opacity=".55"/>
  </g>
  <g filter="url(#shadow)">
