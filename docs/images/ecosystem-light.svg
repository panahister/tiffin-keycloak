        <rect x="846" y="360" width="5" height="82" rx="2.5" fill="url(#accent)"/>
        <text x="866" y="389" fill="#8b5cf6" font-size="13" font-weight="800" letter-spacing="1.2">ACCESS</text>
        <text x="866" y="414" fill="#111827" font-size="16" font-weight="650">Idempotent projection</text>
      </g><g>
        <rect x="846" y="454" width="320" height="82" rx="16" fill="#edf2f8" stroke="#d8e0ea"/>
        <rect x="846" y="454" width="5" height="82" rx="2.5" fill="url(#accent)"/>
        <text x="866" y="483" fill="#8b5cf6" font-size="13" font-weight="800" letter-spacing="1.2">TIFFIN</text>
        <text x="866" y="508" fill="#111827" font-size="16" font-weight="650">No credential duplication</text>
      </g>
    </g>
  <path d="M356 410 C382 410 388 410 410 410" stroke="#22c3ee" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M770 410 C792 410 802 410 824 410" stroke="#22c3ee" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g><g><circle cx="79" cy="585" r="5" fill="#8b5cf6"/><text x="93" y="590" fill="#64748b" font-size="12" font-weight="750" letter-spacing="1">IDENTITY SOURCE OF TRUTH</text></g><g><circle cx="439" cy="585" r="5" fill="#22c3ee"/><text x="453" y="590" fill="#64748b" font-size="12" font-weight="750" letter-spacing="1">PRIVACY-MINIMAL EVENTS</text></g><g><circle cx="799" cy="585" r="5" fill="#8b5cf6"/><text x="813" y="590" fill="#64748b" font-size="12" font-weight="750" letter-spacing="1">RECONCILABLE</text></g></g>
  <text x="1208" y="590" text-anchor="end" fill="#64748b" font-size="12" font-weight="650">PUBLIC REFERENCE · 2026</text>
